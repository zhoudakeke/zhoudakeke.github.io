<!doctype html>
<html lang="zh-CN" data-frame-preview>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e2d4" />
    <meta name="description" content="施·旅拍纯 AI 国风写真与短视频交互原型" />
    <title>施·旅拍 · AI 国风旅拍原型</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./vendor/tdesign-mobile/tdesign.min.css" />
    <link rel="stylesheet" href="./styles.css?v=portfolio-frame-v2" />
  </head>
  <body>
    <a class="skip-link" href="#screen">跳到原型内容</a>

    <div class="prototype-stage" data-design-system="tdesign-mobile-vue+tdesign-miniprogram">
      <nav class="portfolio-nav" aria-label="作品集导航">
        <a class="portfolio-return" href="/">
          <span aria-hidden="true">←</span>
          返回洞洞板
        </a>
      </nav>

      <aside class="prototype-brief" aria-label="原型说明">
        <div>
          <p class="brief-kicker">微信小程序交互原型</p>
          <h1>施·旅拍</h1>
          <p>纯 AI 国风写真与短视频工作室</p>
        </div>
        <dl>
          <div><dt>画布</dt><dd id="platform-size-label">375 × 812 · 750rpx基准</dd></div>
          <div><dt>导航</dt><dd>首页 / 一键旅拍 / 我的</dd></div>
          <div><dt>底部导航</dt><dd>核心入口抬升 · 选中图标品牌色</dd></div>
          <div><dt>组件</dt><dd>TDesign Mobile 展示 / TDesign 小程序交付</dd></div>
          <div><dt>主线</dt><dd>双人像 → 推荐方案 → 写真 + 短视频 → 作品包</dd></div>
          <div><dt>当前页</dt><dd id="route-label">首页</dd></div>
        </dl>
        <div class="brief-actions">
          <label class="device-preset-field" for="device-preset">
            <span>设备适配预览</span>
            <select id="device-preset" aria-label="选择模拟设备尺寸">
              <option value="auto">自动 / 默认375</option>
              <option value="compact">小屏320</option>
              <option value="standard">标准375</option>
              <option value="modern">全面屏390</option>
              <option value="large">大屏430</option>
            </select>
          </label>
          <button type="button" class="brief-button" data-action="open-state-menu">演示页面状态</button>
          <button type="button" class="brief-button brief-button--quiet" data-action="reset-prototype">重置原型</button>
        </div>
        <p class="brief-note">本原型独立运行：人物照片与方案仅在主动保存草稿或确认生成后写入当前浏览器；生成结果使用固定样片。</p>
      </aside>

      <section class="device-frame" aria-label="施·旅拍手机原型">
        <div class="device" id="device">
          <header class="app-bar t-navbar t-navbar--visible-animation" id="app-bar" data-component="navbar">
            <div class="app-bar__content t-navbar__content">
              <button type="button" class="icon-button app-back t-navbar__left" id="app-back" data-action="back" aria-label="返回"><t-icon name="chevron-left" size="24px" aria-hidden="true"></t-icon></button>
              <div class="app-title-wrap t-navbar__center">
                <p class="app-eyebrow" id="app-eyebrow"></p>
                <h2 class="app-title t-navbar__center-title" id="app-title"></h2>
              </div>
            </div>
          </header>

          <main class="screen" id="screen" tabindex="-1" aria-live="polite"></main>

          <nav class="tab-bar t-tab-bar t-tab-bar--bordered t-tab-bar--safe t-tab-bar--normal" id="tab-bar" aria-label="底部导航" data-component="tab-bar" role="tablist"></nav>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>

          <div class="sheet-layer" id="sheet-layer" hidden>
            <button type="button" class="sheet-layer__backdrop" data-action="close-sheet" aria-label="关闭弹窗"></button>
            <section class="bottom-sheet t-popup t-popup--bottom t-action-sheet t-action-sheet--list t-action-sheet--center" id="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-component="action-sheet">
              <div class="sheet-handle" aria-hidden="true"></div>
              <div id="sheet-content"></div>
            </section>
          </div>
        </div>
      </section>
    </div>

    <input id="portrait-file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
    <script src="./platform-metrics.js?v=portfolio-frame-v1"></script>
    <script src="./vendor/tdesign-icons/local-runtime.js?v=20260914-live-five-female-v1"></script>
  <script src="./app.js?v=20260915-template-controls-v1"></script>
  </body>
</html>
